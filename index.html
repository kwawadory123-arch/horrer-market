setInterval(()=>{if(!LB.on)return;lobbyUI();if(isHost&&ch)send({k:'cfg',cfg:LB.cfg})},700);
$('lsolo').onclick=()=>{try{ch&&sb.removeChannel(ch)}catch(e){}ch=null;isHost=true;startGame({dif:LB.cfg.dif,tl:LB.cfg.tl,mon:LB.cfg.mon,seed:LB.cfg.seed})};$('linv').onclick=()=>{const u=location.origin+location.pathname+'?room='+LB.room;(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(u):Promise.reject()).then(()=>setStat('📋 招待リンクをコピーしました'),()=>prompt('招待リンク',u))};{const q=new URLSearchParams(location.search||'').get('room');if(q)$('rm').value=normRoom(q)}
$('cs').onclick=()=>{LB.cfg.seed=Math.random()*1e9|0;lobbyUI()};$('cg').onclick=()=>{send({k:'go',cfg:LB.cfg});startGame(LB.cfg)};
$('bs').onclick=()=>enter('');$('bc').onclick=()=>enter(Math.random().toString(36).slice(2,6).toUpperCase());$('bj').onclick=()=>enter($('rm').value||'');bind('bR',()=>keys['r']=true,()=>keys['r']=false);
genStore(7);bind('bQ',()=>spec++);if(navigator.maxTouchPoints>0||matchMedia('(pointer:coarse)').matches)document.body.classList.add('tc');
setInterval(()=>{$('gr').style.transform=`translate(${ri(20)}px,${ri(20)}px)`},90);{const k=document.createElement('canvas');k.width=k.height=96;const g=k.getContext('2d');for(let i=0;i<9216;i++){const v=ri(256);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(i%96,i/96|0,1,1)}$('gr').style.backgroundImage=`url(${k.toDataURL()})`}
init();$('ov').style.display='flex';requestAnimationFrame(loop);window.addEventListener('error',e=>err(e.error||e.message));
</script>
